name: Prepare isolated test environment

on:
  push:
    branches: ['audit/product-quality-hardening']
    paths: ['.github/workflows/test-environment.yml']

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download analysis tools for the supported test interpreters
        run: |
          mkdir -p offline/wheels
          for version in 3.12 3.13; do
            python3 -m pip download --only-binary=:all: --python-version "$version" --dest offline/wheels ruff mypy radon vulture bandit xenon PyYAML types-PyYAML
          done
          python3 - <<'PY'
          import hashlib, pathlib
          from collections import defaultdict
          dependencies = defaultdict(set)
          for wheel in pathlib.Path('offline/wheels').glob('*.whl'):
              name, version = wheel.name.split('-')[:2]
              dependencies[name.replace('_', '-') + '==' + version].add(hashlib.sha256(wheel.read_bytes()).hexdigest())
          with open('offline/analysis-requirements.txt', 'w') as output:
              for package, hashes in sorted(dependencies.items()):
                  output.write(package + ' ' + ' '.join('--hash=sha256:' + digest for digest in sorted(hashes)) + '\n')
          PY
      - name: Download Debian validator packages
        run: |
          docker run --rm -v "$PWD/offline:/out" debian:trixie-slim bash -euxc '
            apt-get update
            apt-get install -y --download-only --no-install-recommends appstream python3-venv python3-pip
            cd /var/cache/apt/archives
            sha256sum ./*.deb > /out/SHA256SUMS
            tar -czf /out/debian-validator-packages.tar.gz ./*.deb
          '
          docker image inspect debian:trixie-slim --format '{{json .RepoDigests}}' > offline/image-digest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-tools-and-validators
          path: offline/
          retention-days: 3
