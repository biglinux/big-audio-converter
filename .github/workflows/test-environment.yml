name: Prepare isolated test environment

on:
  push:
    branches: ['audit/product-quality-hardening']
    paths: ['.github/workflows/test-environment.yml']

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Debian runtime and test packages
        run: |
          mkdir -p offline
          docker run --rm -v "$PWD/offline:/out" debian:trixie-slim bash -euxc '
            apt-get update
            apt-get install -y --download-only --no-install-recommends python3 python3-gi python3-gi-cairo python3-cairo python3-numpy python3-mpv gir1.2-gtk-4.0 gir1.2-adw-1 python3-pytest python3-pytest-cov python3-hypothesis python3-polib gettext desktop-file-utils python3-pyatspi at-spi2-core python3-dbus xdotool xauth dbus-x11 xvfb libgtk-4-bin adwaita-icon-theme
            cd /var/cache/apt/archives
            sha256sum ./*.deb > /out/SHA256SUMS
            tar -czf /out/debian-test-packages.tar.gz ./*.deb
          '
          docker image inspect debian:trixie-slim --format '{{json .RepoDigests}}' > offline/image-digest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-native-test-environment
          path: offline/
          retention-days: 3
