name: Build Package

# Packages are built by the BigLinux builder on GitLab
# (https://gitlab.bigib.org/builder/packagebuilder). The biglinux organization
# starts a build when a run of the workflow with this name finishes
# successfully, for the branch of that run: main goes to the unstable
# repository, testing-* to testing and stable-* to stable. This workflow sends
# nothing itself and needs no secret: it only has to succeed when, and only
# when, the package may be built. Keep its name and the final job "build".
# See docs/ci-packaging.md.

on:
  push:
    branches: [main, "testing-*", "stable-*"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running one: the builder always
# clones the head of the branch, so only the last run needs to request a build
concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the package build
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # A failed run requests nothing, so manual runs from other branches fail
          case "$BRANCH" in
            main) repo=unstable ;;
            testing-*) repo=testing ;;
            stable-*) repo=stable ;;
            *)
              echo "::error::Packages are built only from main, testing-* and stable-*, not '$BRANCH'"
              exit 1
              ;;
          esac
          echo "Tests passed for $GITHUB_SHA."
          echo "When this run ends, the builder builds branch $BRANCH for the $repo repository;"
          echo "the GitLab Status workflow follows that job."
          printf '### Build requested\nBranch %s (%s), %s repository.\n' "$BRANCH" "$GITHUB_SHA" "$repo" \
            >>"$GITHUB_STEP_SUMMARY"