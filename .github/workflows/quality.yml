name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg python3-pytest python3-pytest-cov python3-hypothesis python3-gi python3-gi-cairo python3-cairo python3-numpy python3-mpv gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth xdotool dbus-x11 gettext desktop-file-utils appstream
      - name: Fetch big-gtk-kit
        run: |
          git clone --depth 1 https://github.com/biglinux/big-gtk-kit.git "$RUNNER_TEMP/big-gtk-kit"
          echo "PYTHONPATH=$RUNNER_TEMP/big-gtk-kit/python" >> "$GITHUB_ENV"
      - name: Test
        run: xvfb-run -a -s '-screen 0 1366x900x24' dbus-run-session -- /usr/bin/python3 -m pytest -q -m "not extended" --junitxml=test-results/tests.xml --cov=big-audio-converter/usr/share/biglinux/audio-converter/app --cov-branch --cov-report=xml:test-results/coverage.xml
      - name: Property and fuzz tests
        if: github.event_name == 'workflow_dispatch'
        run: /usr/bin/python3 -m pytest -q -m extended tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
